[flake8]
ignore = 
    W503,
    F811
exclude = 
    tests/,
    */migrations/,
    venv/,
    */venv/,
    env/,
    */env/,
    .venv/,
    */__init__.py,
    */settings.py,
    */tests.py

per-file-ignores =
    */settings.py:E501
[isort]
src_paths = backend
skip = tests,venv,migrations,.venv,env,.env,myenv